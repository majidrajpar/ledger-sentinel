name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ledger-sentinel
            asset_name: ledger-sentinel-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ledger-sentinel
            asset_name: ledger-sentinel-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ledger-sentinel.exe
            asset_name: ledger-sentinel-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} -p ledger-sentinel
        
      - name: Rename Binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}
          
      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
